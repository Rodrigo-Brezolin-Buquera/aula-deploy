<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dark Mode com LocalStorage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header class="header">
    <h1>Minha Aplicação</h1>
    <button id="toggle-theme">Alternar Tema</button>
  </header>

  <main class="container">
    <section class="intro">
      <h2>Bem-vindo!</h2>
      <p>
        Esse é um exemplo de aplicação que salva sua preferência de tema usando localStorage.
      </p>
    </section>

    <section class="cards">
      <div class="card">
        <h3>Produto 1</h3>
        <p>Descrição simples de um produto.</p>
        <button>Comprar</button>
      </div>

      <div class="card">
        <h3>Produto 2</h3>
        <p>Outro produto com descrição.</p>
        <button>Comprar</button>
      </div>

      <div class="card">
        <h3>Produto 3</h3>
        <p>Mais um item para exemplo.</p>
        <button>Comprar</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 - Exemplo de aula Front-end</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
